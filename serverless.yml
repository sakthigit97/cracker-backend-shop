resources:
  Resources:
    ProductImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: sivakasi-pyropark-${aws:accountId}-${self:provider.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - http://localhost:5173
                - https://frontend-cracker-shop.vercel.app
                - https://www.sivakasicrackers.co.in
                - https://www.sivakasipyropark.co.in
              AllowedMethods:
                - GET
                - PUT
                - POST
              AllowedHeaders:
                - "*"
              MaxAge: 3000
    ProductImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: sivakasi-pyropark-${aws:accountId}-${self:provider.stage}
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadProductImages
              Effect: Allow
              Principal: "*"
              Action:
                - s3:GetObject
              Resource:
                - arn:aws:s3:::sivakasi-pyropark-${aws:accountId}-${self:provider.stage}/products/*
                - arn:aws:s3:::sivakasi-pyropark-${aws:accountId}-${self:provider.stage}/categories/*
                - arn:aws:s3:::sivakasi-pyropark-${aws:accountId}-${self:provider.stage}/brands/*
                - arn:aws:s3:::sivakasi-pyropark-${aws:accountId}-${self:provider.stage}/imports/*
                - arn:aws:s3:::sivakasi-pyropark-${aws:accountId}-${self:provider.stage}/config/*

            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action:
                - s3:GetObject
              Resource:
                - arn:aws:s3:::sivakasi-pyropark-${aws:accountId}-${self:provider.stage}/*
              Condition:
                StringEquals:
                  AWS:SourceArn: arn:aws:cloudfront::${aws:accountId}:distribution/${env:DISTRIBUTION_ID}

    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Users-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: mobile
            AttributeType: S
          - AttributeName: referralCode
            AttributeType: S

        KeySchema:
          - AttributeName: mobile
            KeyType: HASH

        GlobalSecondaryIndexes:
          - IndexName: referralCode-index
            KeySchema:
              - AttributeName: referralCode
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    BrandsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Brands-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: brandId
            AttributeType: S
        KeySchema:
          - AttributeName: brandId
            KeyType: HASH

    CategoriesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Categories-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: categoryId
            AttributeType: S
        KeySchema:
          - AttributeName: categoryId
            KeyType: HASH

    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Orders-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: orderId
            AttributeType: S
          - AttributeName: meta
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: N
          - AttributeName: status
            AttributeType: S

        KeySchema:
          - AttributeName: orderId
            KeyType: HASH
          - AttributeName: meta
            KeyType: RANGE

        GlobalSecondaryIndexes:
          - IndexName: userId-createdAt-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: meta-createdAt-index
            KeySchema:
              - AttributeName: meta
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: status-meta-index
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: meta
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: status-createdAt-index
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

