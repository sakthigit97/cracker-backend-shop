      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Products-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: productId
            AttributeType: S
          - AttributeName: categoryId
            AttributeType: S
          - AttributeName: brandId
            AttributeType: S
          - AttributeName: isActive
            AttributeType: S

        KeySchema:
          - AttributeName: productId
            KeyType: HASH

        GlobalSecondaryIndexes:
          - IndexName: isActive-index
            KeySchema:
              - AttributeName: isActive
                KeyType: HASH
            Projection:
              ProjectionType: ALL

          - IndexName: categoryId-index
            KeySchema:
              - AttributeName: categoryId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

          - IndexName: brandId-index
            KeySchema:
              - AttributeName: brandId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    DiscountsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Discounts-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: discountId
            AttributeType: S
        KeySchema:
          - AttributeName: discountId
            KeyType: HASH

    CartsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Carts-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: cartId
            AttributeType: S
          - AttributeName: itemId
            AttributeType: S
        KeySchema:
          - AttributeName: cartId
            KeyType: HASH
          - AttributeName: itemId
            KeyType: RANGE

    AdminConfigTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: AdminConfig-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: configId
            AttributeType: S
        KeySchema:
          - AttributeName: configId
            KeyType: HASH

    ContactUsTable:
      Type: AWS::DynamoDB::Table
